name: Release

# リリース準備 PR（prepare-release.yml が作る `chore(release): vX.Y.Z`）を squash マージすると動く。
# release-automate が draft の Release とタグを作り、続けて次の順に進む。
#   draft → テスト・ビルド（GoReleaser）・MSIX → 成果物の添付 → Release から再取得して検証 → 公開
# リリース準備 PR 以外の main への push では、draft ジョブが skip され、後続のジョブも動かない。
# PR では公開権限を使わず、GoReleaser のスナップショットビルドと成果物の構造だけを検証する（MSIX は CI の MSIX Package が検証する）。
#
# release-automate のタグは GITHUB_TOKEN で作られ、`push: tags` の別のワークフローを起動しない。
# そのためタグの push ではなく、main への push を起点にする。
#
# 失敗したときは、同じ実行で「Re-run failed jobs」を使う（新しいタグを切らない）。
# 公開済みの Release は再実行でも変更されない。

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .goreleaser.yml
      - scripts/attach-release-assets.sh
      - scripts/verify-release-assets.sh

permissions: {}

jobs:
  draft:
    if: github.event_name == 'push'
    # `chore(release):` で始まるコミット以外は、release-automate 側の条件で skip される。
    uses: scottlz0310/release-automate/.github/workflows/reusable-publish-release.yml@3b5092d9f1a7ed9f29fb33f6e598d1e8534bb8cf # v2.1.0
    permissions:
      contents: write
    with:
      draft: true

  test:
    needs: draft
    if: ${{ !cancelled() && needs.draft.outputs.release_state == 'draft' }}
    # ci.yml の必須チェック `Test` と同名にしない。PR ではこのジョブが skip されるため、
    # 同名だと (app, name) ごとの最新 run が skipped に置き換わり、必須チェックの成功を確認できなくなる。
    name: Release Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ format('refs/tags/{0}', needs.draft.outputs.tag_name) }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

  build:
    needs: draft
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.draft.outputs.release_state == 'draft') }}
    name: Build (GoReleaser)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ needs.draft.outputs.target_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # GoReleaser はタグから版を決めるため、push ではタグを checkout する
          ref: ${{ github.event_name == 'push' && format('refs/tags/{0}', needs.draft.outputs.tag_name) || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag points to release commit
        if: github.event_name == 'push'
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 公開は release-automate の draft と、後段の attach ジョブが担う。GoReleaser はビルドと checksum だけを行う。
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: ${{ github.event_name == 'push' && 'release --clean --skip=publish' || 'release --snapshot --clean' }}

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          name: dist-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  msix:
    needs: [draft, build]
    # MSIX の版は数値 4 要素のみのため、prerelease タグは対象外（prepare-release.yml が安定版だけを通す）
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.draft.outputs.release_state == 'draft' }}
    name: MSIX
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.draft.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.target_sha }}
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          name: dist-archives
          path: ${{ runner.temp }}/archives

      # GoReleaser が作った Windows バイナリをそのままパッケージ化し、配布物の出所を 1 つに保つ
      - name: Extract Windows binary
        shell: pwsh
        run: |
          $zip = "dsx_$($env:TAG.TrimStart('v'))_windows_amd64.zip"
          Expand-Archive "$env:RUNNER_TEMP\archives\$zip" -DestinationPath "$env:RUNNER_TEMP\bin"

      - name: Restore signing certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if (-not $env:SIGNING_CERTIFICATE_BASE64) {
            throw "Secret SIGNING_CERTIFICATE_BASE64 が未設定です（packaging/msix/New-SigningCertificate.ps1 参照）"
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx",
            [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))

      - name: Build and sign MSIX
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          ./packaging/msix/Build-Msix.ps1 -BinaryPath "$env:RUNNER_TEMP\bin\dsx.exe" -Tag $env:TAG `
            -OutDir "$env:RUNNER_TEMP\msix" -PfxPath "$env:RUNNER_TEMP\signing.pfx"

      - name: Add installer script
        shell: pwsh
        run: Copy-Item -LiteralPath "scripts/install.ps1" -Destination "$env:RUNNER_TEMP\msix\install.ps1"

      # 生成した直後の checksum を記録する。attach → 再取得の間で MSIX 一式が壊れたり差し替わったりしたら、
      # verify-release-assets.sh が検出する。sha256sum -c が読める形式（"<hash>  <name>"、LF）で書く。
      - name: Record MSIX checksums
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP\msix"
          $lines = foreach ($name in "dsx_x64.msix", "dsx.appinstaller", "dsx.cer", "install.ps1") {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $name).Hash.ToLowerInvariant(), $name
          }
          [IO.File]::WriteAllText("$PWD\checksums-msix.txt", ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))

      - name: Upload MSIX assets
        uses: actions/upload-artifact@v7
        with:
          name: dist-msix
          path: ${{ runner.temp }}/msix/
          if-no-files-found: error

  attach:
    needs: [draft, test, build, msix]
    if: ${{ !cancelled() && needs.draft.outputs.release_state == 'draft' && needs.test.result == 'success' && needs.build.result == 'success' && needs.msix.result == 'success' }}
    name: Attach assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.draft.outputs.tag_name }}
      TARGET_SHA: ${{ needs.draft.outputs.target_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.target_sha }}
          persist-credentials: false

      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: assets
          merge-multiple: true

      - name: Attach assets to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh scripts/attach-release-assets.sh "$TAG" "$TARGET_SHA" assets

  # draft Release の asset 取得には write 権限が必要なため、公開経路の収集だけ write を使い、
  # 成果物を実行する verify ジョブには read 権限だけを渡す。
  collect:
    needs: [draft, attach]
    if: ${{ !cancelled() && needs.attach.result == 'success' }}
    name: Collect release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TAG: ${{ needs.draft.outputs.tag_name }}
    steps:
      - name: Download assets from draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TAG" --dir assets

      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error

  collect-dry-run:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.build.result == 'success' }}
    name: Collect snapshot assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-archives
          path: assets

      # スナップショットの版は GoReleaser が決めるため、アーカイブ名から取り出す
      - id: version
        run: |
          archive=$(ls assets/dsx_*_linux_amd64.tar.gz)
          version=${archive#assets/dsx_}
          echo "version=${version%_linux_amd64.tar.gz}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error

  verify-linux:
    needs: [collect, collect-dry-run]
    if: ${{ !cancelled() && (needs.collect.result == 'success' || needs.collect-dry-run.result == 'success') }}
    name: Verify (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.collect.outputs.version || needs.collect-dry-run.outputs.version }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout verify script
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/verify-release-assets.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: assets

      - name: Verify assets and run binary
        run: |
          # push では MSIX 一式も揃っていることを確認する
          if [ "$EVENT_NAME" = push ]; then
            sh scripts/verify-release-assets.sh assets "$VERSION" --with-msix
          else
            sh scripts/verify-release-assets.sh assets "$VERSION"
          fi

  verify-windows:
    needs: [collect, collect-dry-run]
    if: ${{ !cancelled() && (needs.collect.result == 'success' || needs.collect-dry-run.result == 'success') }}
    name: Verify (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.collect.outputs.version || needs.collect-dry-run.outputs.version }}
    steps:
      - name: Checkout verify script
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/Test-ReleaseMsix.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: assets

      # PR のスナップショットには MSIX が無い（MSIX は CI の MSIX Package が検証する）
      - name: Verify MSIX package and signature
        if: github.event_name == 'push'
        shell: pwsh
        run: ./scripts/Test-ReleaseMsix.ps1 -Dir assets -Version $env:VERSION

      - name: Run Windows binary
        shell: pwsh
        run: |
          Expand-Archive "assets/dsx_${env:VERSION}_windows_amd64.zip" -DestinationPath bin
          $out = & ./bin/dsx.exe --version
          if ($LASTEXITCODE -ne 0 -or $out -notmatch [regex]::Escape($env:VERSION)) {
            throw "dsx.exe --version の出力が想定と異なります（期待する版: $env:VERSION、実際: $out）"
          }
          Write-Host $out

  finalize:
    needs: [draft, verify-linux, verify-windows]
    if: ${{ !cancelled() && needs.draft.outputs.release_state == 'draft' && needs.verify-linux.result == 'success' && needs.verify-windows.result == 'success' }}
    uses: scottlz0310/release-automate/.github/workflows/reusable-finalize-release.yml@3b5092d9f1a7ed9f29fb33f6e598d1e8534bb8cf # v2.1.0
    permissions:
      contents: write
    with:
      tag_name: ${{ needs.draft.outputs.tag_name }}
      target_sha: ${{ needs.draft.outputs.target_sha }}
